<!DOCTYPE html>
<html>
    <head>
        <title>Add Question</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>Add Question</h1>
        {% if error %}
        <p>{{ error }}</p>
        {% endif %}
        <form method="POST" class="form-card">
            <label>Question:</label>
            <input type="text" name="question" value="{{ question }}" required>
            <label>Answer A:</label>
            <input type="text" name="answer_a" value="{{ answer_a }}" required>
            <label>Answer B:</label>
            <input type="text" name="answer_b" value="{{ answer_b }}" required>
            <label>Answer C:</label>
            <input type="text" name="answer_c" value="{{ answer_c }}" required>
            <label>Answer D:</label>
            <input type="text" name="answer_d" value="{{ answer_d }}" required>
            <label>Correct Answer:</label>
            <select name="correct_answer">
                <option value="A" {% if correct_answer == "A" %}selected{% endif %}>A</option>
                <option value="B" {% if correct_answer == "B" %}selected{% endif %}>B</option>
                <option value="C" {% if correct_answer == "C" %}selected{% endif %}>C</option>
                <option value="D" {% if correct_answer == "D" %}selected{% endif %}>D</option>
            </select>
            <button class="button">Save Question</button>
        </form>
        <a href="/quiz/{{ quiz_id }}" class="back-link">Back to Quiz</a>
    </body>
</html>
